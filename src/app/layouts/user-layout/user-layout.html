 <!-- left panel -->
<div class="container-fluid">
  <div class="row vh-100">

    <!-- LEFT SIDEBAR -->
    <div class="col-md-3 col-lg-2 bg-light border-end d-flex flex-column p-3">

      <h4 class="text-success fw-bold mb-4">🏦 Anand Bank</h4>

      <!-- Account Info -->
      <div class="card bg-success text-white mb-4">
        <div class="card-body p-3">
          <small>Account Number</small>
          <h6 class="mb-1">SB1234567890</h6>
          <span class="badge bg-light text-success">Active</span>
        </div>
      </div>

      <!-- Menu -->
      <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item">
          <a routerLink="dashboard" routerLinkActive="active"
             class="nav-link text-dark">
            Overview
          </a>
        </li>

        <li>
          <a routerLink="fundTransfer" routerLinkActive="active"
             class="nav-link text-dark">
            Transfer Funds
          </a>
        </li>

        <li>
          <a routerLink="/user/transactions" routerLinkActive="active"
             class="nav-link text-dark">
            Transactions
          </a>
        </li>

        <li>
          <a routerLink="/user/statement" routerLinkActive="active"
             class="nav-link text-dark">
            Statement
          </a>
        </li>
      </ul>

      <hr>

      <!-- Profile Section -->
      <div>
        <strong>Rahul Sharma</strong><br>
        <small class="text-muted">rahul.sharma@email.com</small>
        <button class="btn btn-outline-secondary btn-sm w-100 mt-2" (click)="logout()">
          Sign Out
        </button>
      </div>

    </div>

    <!-- RIGHT PANEL -->
    <div class="col-md-9 col-lg-10 bg-white p-4 overflow-auto">
      <router-outlet></router-outlet>
    </div>

  </div>
</div>
